<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELOTEROS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
    <h1>PELOTEROS</h1>
</header>

<section>
    <h2>Introducción</h2>
    <p>
        Realizamos estimaciones o predicciones de los resultados de un evento deportivo,
        basados en el análisis de datos y estadísticas.
    </p>
</section>

<section>
    <div class="galeria">
        <!-- coloca tus imágenes en la carpeta "images" y actualiza los nombres abajo -->
        <img src="images/descarga.webp" alt="">
        <img src="images/descarga(1).webp" alt="">
        <img src="images/descarga(2).webp" alt="">
    </div>
</section>

<section>
    <h2>Agregar comentario</h2>

    <form id="formulario">
        <input type="text" id="nombre" placeholder="Tu nombre" required>
        <textarea id="mensaje" placeholder="Escribe tu comentario..." required></textarea>
        <button type="submit">Enviar</button>
    </form>

    <div id="lista-comentarios"></div>
</section>

<footer>2026 PELOTEROS. Todos los derechos reservados</footer>

<script src="js/app.js"></script>
</body>
</html>
